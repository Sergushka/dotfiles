name: media-server

services:
  jellyfin:
    # jellyfin 12.4
    image: "${JELLYFIN_IMAGE:-jellyfin/jellyfin@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771}"
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    environment:
      TZ: "${TZ}"
    volumes:
      - "${CONFIG_DIR:?Set CONFIG_DIR in .env}/jellyfin:/config"
      - "${CONFIG_DIR:?Set CONFIG_DIR in .env}/jellyfin/cache:/cache"
      - "${MEDIA_DIR:?Set MEDIA_DIR in .env}/Movies:/media/movies:ro"
      - "${MEDIA_DIR:?Set MEDIA_DIR in .env}/tv:/media/tv:ro"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8096:8096"
      - "${BIND_ADDRESS:-0.0.0.0}:7359:7359/udp"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  radarr:
    # radarr 6.4.4.10685-ls326
    image: "${RADARR_IMAGE:-lscr.io/linuxserver/radarr@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2}"
    container_name: radarr
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - "${CONFIG_DIR:?Set CONFIG_DIR in .env}/radarr:/config"
      - "${MEDIA_DIR:?Set MEDIA_DIR in .env}:/data"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:7878:7878"
    restart: unless-stopped

  sonarr:
    # sonarr 4.0.20.3014-ls4
    image: "${SONARR_IMAGE:-lscr.io/linuxserver/sonarr@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571}"
    container_name: sonarr
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - "${CONFIG_DIR:?Set CONFIG_DIR in .env}/sonarr:/config"
      - "${MEDIA_DIR:?Set MEDIA_DIR in .env}:/data"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8989:8989"
    restart: unless-stopped

  prowlarr:
    # prowlarr 2.7.0.5723-ls168
    image: "${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr@sha256:6660787a99b2e58203539583663c973b48979fc00ff2cb78dc0ea17429e1f6ef}"
    container_name: prowlarr
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - "${CONFIG_DIR:?Set CONFIG_DIR in .env}/prowlarr:/config"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:9696:9696"
    restart: unless-stopped

  qbittorrent:
    # qbittorrent 5.2.3_v2.0.14-ls472
    image: "${QBITTORRENT_IMAGE:-lscr.io/linuxserver/qbittorrent@sha256:212b86dff59e3962b4082b5ef20a577e76c8f8527d2ab505cfa887b4bcecb0b0}"
    container_name: qbittorrent
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      WEBUI_PORT: "8080"
    volumes:
      - "${CONFIG_DIR:?Set CONFIG_DIR in .env}/qbittorrent:/config"
      - "${MEDIA_DIR:?Set MEDIA_DIR in .env}:/data"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8080:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:6881:6881"
      - "${BIND_ADDRESS:-0.0.0.0}:6881:6881/udp"
    restart: unless-stopped

  bazarr:
    # bazarr v1.6.2-ls372
    image: "${BAZARR_IMAGE:-lscr.io/linuxserver/bazarr@sha256:832820dec70bce9e912c6eee7a95baf6551e03dbc63325a7208daaa455423752}"
    container_name: bazarr
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - "${CONFIG_DIR:?Set CONFIG_DIR in .env}/bazarr:/config"
      - "${MEDIA_DIR:?Set MEDIA_DIR in .env}:/data"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:6767:6767"
    restart: unless-stopped

  jellyseerr:
    # jellyseerr v3.5.2
    image: "${JELLYSEERR_IMAGE:-ghcr.io/seerr-team/seerr@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2}"
    init: true
    container_name: jellyseerr
    environment:
      TZ: "${TZ}"
    volumes:
      - "${CONFIG_DIR:?Set CONFIG_DIR in .env}/jellyseerr:/app/config"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:5055:5055"
    restart: unless-stopped

  flaresolverr:
    # flaresolverr v3.5.2
    image: "${FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767}"
    container_name: flaresolverr
    init: true
    environment:
      LOG_LEVEL: warning
      TZ: "${TZ}"
    ports:
      - "127.0.0.1:8191:8191"
    tmpfs:
      - /tmp:size=256M,mode=1777
    shm_size: 256m
    restart: unless-stopped
